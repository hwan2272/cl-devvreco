<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hwan2272 Devvreco</title>
  <meta name="description" content="박정환 - Software Engineer, AI Lab Leader 포트폴리오" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>D</text></svg>" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 테마 깜빡임 방지: 렌더링 전에 저장된 테마 적용
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="맨 위로">
        <span class="brand-mark">D</span>
        <span class="brand-text"><strong>hwan2272 Devvreco</strong> <small>(Dev Records)</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="주요 메뉴">
        <a href="#aboutme" data-section="aboutme">About Me</a>
        <a href="#skills" data-section="skills">Skills</a>
        <a href="#projects" data-section="projects">Projects</a>
        <a href="#contacts" data-section="contacts">Contacts</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="다크 모드 전환" title="테마 전환">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <main id="main">
    <!-- About -->
    <section id="aboutme" class="section hero">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow">About Me</p>
          <h1 class="hero-name" id="profileName"></h1>
          <p class="hero-role" id="profileRole"></p>
          <ul class="about-list" id="aboutList"></ul>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#projects">Projects 보기</a>
            <a class="btn btn-ghost" href="#contacts">Contacts</a>
          </div>
          <div class="version-note" id="versionNote"></div>
        </div>
        <aside class="hero-card" aria-label="요약">
          <div class="stat"><span class="stat-num" id="statProjects">-</span><span class="stat-label">Projects</span></div>
          <div class="stat"><span class="stat-num" id="statWork">-</span><span class="stat-label">현업 프로젝트</span></div>
          <div class="stat"><span class="stat-num" id="statKosa">-</span><span class="stat-label">KOSA 인증</span></div>
          <div class="stat"><span class="stat-num" id="statYears">-</span><span class="stat-label">경력 시작</span></div>
          <div class="hero-card-links" id="heroLinks"></div>
        </aside>
      </div>
    </section>

    <!-- Skills -->
    <section id="skills" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Skills</h2>
        </div>
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Projects</h2>
        </div>

        <div class="toolbar">
          <!-- 프로젝트 검색 (현재 미사용, 다시 쓰려면 주석 해제)
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="projectSearch" type="search" placeholder="프로젝트, 기술 검색 (예: React, Nginx, RAG)" aria-label="프로젝트 검색" />
          </div>
          -->
          <div class="chips" id="projectFilter" role="tablist" aria-label="프로젝트 구분">
            <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">전체</button>
            <button class="chip" data-filter="work" role="tab" aria-selected="false">현업</button>
            <button class="chip" data-filter="personal" role="tab" aria-selected="false">개인</button>
          </div>
          <button class="btn btn-ghost btn-sm" id="toggleAll" type="button">모두 펼치기</button>
        </div>
        <p class="result-count" id="resultCount" aria-live="polite"></p>

        <div class="projects-layout">
          <nav class="project-index" aria-label="프로젝트 목차">
            <p class="project-index-title">목차</p>
            <ol id="projectIndex"></ol>
          </nav>
          <div class="project-list" id="projectList"></div>
        </div>
      </div>
    </section>

    <!-- Contacts -->
    <section id="contacts" class="section">
      <div class="container">
        <div class="section-head">
          <h2>Contacts</h2>
        </div>
        <div class="contacts-grid" id="contactsGrid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <strong>hwan2272 Devvreco</strong>
      <span id="copyright"></span>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="맨 위로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <dialog class="lightbox" id="lightbox" aria-labelledby="lightboxCaption">
    <div class="lightbox-head">
      <p class="lightbox-title" id="lightboxCaption"></p>
      <button class="icon-btn" id="lightboxClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="lightbox-body">
      <img id="lightboxImg" alt="" />
    </div>
    <div class="lightbox-nav" id="lightboxNav">
      <button class="icon-btn" id="lightboxPrev" type="button" aria-label="이전 이미지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <span id="lightboxCount"></span>
      <button class="icon-btn" id="lightboxNext" type="button" aria-label="다음 이미지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </dialog>

  <dialog class="frame-modal" id="frameModal" aria-labelledby="frameTitle">
    <div class="frame-head">
      <strong class="frame-title" id="frameTitle"></strong>
      <a class="btn btn-sm btn-ghost" id="frameOpen" href="#" target="_blank" rel="noopener noreferrer">새 탭에서 열기</a>
      <button class="icon-btn" id="frameClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <iframe id="frameView" title="링크 미리보기" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
